[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deg_zinb"
version = "0.1.0"
description = "NB-based models for DEG"
requires-python = ">=3.8"
dependencies = [
	"anndata",
	"numpy",
	"pandas",
	"torch",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
torch = ["torch"]